server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlsnap}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

app:
  base-url: ${BASE_URL:http://localhost:8080}
  cache:
    maximum-size: ${CACHE_MAXIMUM_SIZE:10000}
    ttl-seconds: ${CACHE_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    maximum-clients: ${RATE_LIMIT_MAXIMUM_CLIENTS:10000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
