services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urlsnap
      POSTGRES_USER: urlsnap
      POSTGRES_PASSWORD: urlsnap-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlsnap -d urlsnap"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/urlsnap
      DB_USERNAME: urlsnap
      DB_PASSWORD: urlsnap-local-only
      JWT_SECRET: local-compose-secret-change-before-production
      BASE_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
